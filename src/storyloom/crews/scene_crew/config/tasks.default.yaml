#
# 场景生成 Crew 的标准任务默认配置（6 步种子）
# 本文件只用于首次播种；运行时的任务配置保存在数据库 task_configs 表，
# Flow 与标准 Crew 共用数据库里的同一份 description / expected_output。
# - agent / context 由 crew.py 的 @task 方法显式装配
# - description 中的 {placeholder} 在 kickoff(inputs={...}) 时填充；
#   JSON 示例的花括号已转义为 {{ }} 以兼容 .format 插值
# - Flow 内的单 Agent 步骤直接 Agent.kickoff()，多角色同场才组建 Crew
#   并在此处创建对应的动态 Task
# ============================================================

surprise_proposal:
  description: |
    故事: {project_title}
    {memory_block}
    本场景要求: {scene_brief}
    {cooldown_hint}

    当前活跃伏笔（可尝试关联）:
    {active_foreshadowings}

    请评估本场景是否需要意外元素。
    如果需要，输出 JSON 提案，字段:
    - surprise_type: character/information/environment/relationship/temporal
    - description: 意外事件描述
    - justification: 为什么合理
    - impact_on_plot: 对后续剧情影响
    - linked_foreshadow_id: 可关联的伏笔 ID(可为 null)
    - severity: minor/moderate/major
    如果不需要，输出: {{"no_surprise": true, "reason": "原因说明"}}
  expected_output: "JSON 意外事件提案或不需要意外的声明"

foreshadowing_ops:
  description: |
    故事: {project_title}
    {memory_block}
    本场景: {scene_brief}
    在场角色: {present_characters}

    ===== 当前伏笔状态表 =====
    {foreshadow_table}

    ===== 紧急提醒 =====
    {urgent_alerts}

    ===== SurpriseAgent 的意外提案 =====
    {surprise_proposal}

    请输出 JSON 格式的伏笔操作建议列表，每项包含:
    - action: plant/reinforce/activate/resolve/subvert/alert
    - foreshadow_id: 操作的伏笔 ID(新建时为 null)
    - description: 具体操作描述
    - new_foreshadow: 若 action=plant，填写新伏笔详情
      (description, target_revelation, linked_characters, max_dormant_scenes)
    - link_to_surprise: 是否与意外提案联动(bool)
    输出格式: {{"operations": [...]}}
  expected_output: "JSON 伏笔操作建议列表"

director_plan:
  description: |
    故事: {project_title}
    {memory_block}
    用户场景要求: {scene_brief}

    ===== 时空锚定（规划前必须先完成）=====
    1. 当前时刻与地点：明确此刻是几号、几点、谁在哪里
    2. 与上轮连续性校验：上轮结束时的时刻与地点是否与本轮衔接，有无时间缺口或地点跳变
    3. 信息迷雾总纲：本场景所有角色只能知道他们有途径知道的事

    ===== 意外 Agent 提案 =====
    {surprise_proposal}

    ===== 伏笔 Agent 建议 =====
    {foreshadowing_ops}

    作为导演，请综合以上所有信息，输出最终的'场景意图包' JSON:
    - goal: 戏剧目标
    - conflict: 冲突/伏笔
    - emotion_arc: 情绪曲线
    - forbidden: 禁止发生的事
    - adopted_surprise: 采纳的意外（null 表示不采纳）
    - adopted_foreshadow_ops: 采纳的伏笔操作列表
    - rejection_reasons: 否决某提案的理由（如有）
    你有权否决任何提案，但必须给出理由。
  expected_output: "JSON 场景意图包"

actor_interaction:
  description: |
    {focus_instruction}

    导演意图(仅供参考，不要直接复述):
    {director_intent}

    背景资料:
    {rag_context}

    {memory_block}

    要求：{character_name} 只能说他/她有途径知道的事（信息迷雾），
    不得提及自己不在场、未被告知的事件；记得并兑现自己此前说过要做的事；
    不迎合、不抢戏；言行要付出代价或留下痕迹。
  expected_output: "{character_name}的行动与台词记录"

consistency_check:
  description: |
    检查以下角色行动记录:
    {actor_log}

    角色设定:
    {character_data}

    活跃伏笔:
    {foreshadow_data}

    ===== 本场景已采纳的伏笔/意外 =====
    {director_constraints}

    检查项：
    1. 角色行为是否符合人设
    2. 时间线是否合理
    3. 已采纳的意外事件是否'合理但意外'而非'莫名其妙'
    4. 伏笔操作是否与已有设定冲突
    5. 信息越权：角色是否说出了他没有途径知道的信息
    6. 关系跳变：好感/信任是否无事件依据地大幅变化
    7. 数值矛盾：时间、金钱、物品数量是否前后一致
    8. 承诺兑现：角色此前明确说过要做的事是否被正确处理
    输出 JSON: {{"passed": ..., "conflicts": [...], "severity": "..."}}
    只输出冲突结论，不要复述剧情。
  expected_output: "JSON 一致性报告"

prose_polish:
  description: |
    请把以下角色行动日志，改写成统一风格('{style}')的正式小说正文（约 1200-1400 字）。
    像一个隐形在场的叙述者一样，融合对话、动作、心理与环境描写。

    本场景已采纳的伏笔与意外（必须自然体现，不可点破）:
    {director_constraints}

    ===== 写作规范 =====
    1. 视角：从在场角色可感知的角度叙述，不写他们看不到的事（比如躲在门外偷听的人、他们不知道的暗线）
    2. 心理活动：用"念头自己冒出来"的方式呈现（"这个念头自己冒了出来——"），不用"他感到很愤怒"式直白陈述；不喊口号、不总结、不灌鸡汤
    3. 动作与手工：给足过程细节，允许失败与返工（裁歪、写坏、重贴、试错），让时间在手工里真实流逝
    4. 氛围：环境、天气、光线、声音必须与角色当下的情绪基调对齐
    5. 数字：涉及时间、金钱、数量时用具体数字并与前文一致，不许模糊
    6. 伏笔与意外：自然织入，不能让读者觉得刻意；意外事件用节奏感和氛围烘托冲击力
    7. 结尾：停在一个具体、可被行动回应的处境（门被推开、手机震动、车在楼下按喇叭），不总结、不感慨

    角色行动日志:
    {actor_log}
  expected_output: "一段 1200-1400 字的小说正文"
